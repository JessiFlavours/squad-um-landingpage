services:
  app:
    build:
      context: ./app
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: db
      DATABASE_NAME: tasks_colaborativas
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_CHARSET: utf8mb4
      JWT_SECRET: k8sP2mXqL9nR4vT7wY3uA6jF1hD5gB0cQ9eT4mZ2wX8vN6yK3jH7fD1sA5gR0pL
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tasks_colaborativas
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
